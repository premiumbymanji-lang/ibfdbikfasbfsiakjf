<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ShopApp – Premium Mobile Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     GLOBAL DESIGN SYSTEM
     ============================================================ */
  :root {
    --bg-app: #F1F3F6;
    --bg-card: #FFFFFF;
    --text-primary: #212121;
    --text-muted: #878787;
    --text-success: #388E3C;
    --action-yellow: #FFC200;
    --action-orange: #FB641B;
    --brand-blue: #2874F0;
    --sale-blue: #28B2FF;
    --border-subtle: #E0E0E0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* Disable text selection and tap highlights globally (native-app feel):
     prevents the OS text-selection / copy / search popup on tap-and-hold */
  * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Re-enable selection ONLY for inputs so users can still type and edit */
  input, textarea {
    -webkit-user-select: auto;
    -khtml-user-select: auto;
    -moz-user-select: auto;
    -ms-user-select: auto;
    user-select: auto;
  }

  html, body {
    background: #d8dce1;
    font-family: 'Inter', 'Roboto', sans-serif;
    color: var(--text-primary);
    font-size: 14px;
  }

  /* ---- CRITICAL: Mobile-only app shell ---- */
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    background: var(--bg-app);
    box-shadow: 0 0 12px rgba(0,0,0,.15);
  }

  button { font-family: inherit; cursor: pointer; border: none; }
  a { text-decoration: none; color: inherit; }

  /* ============================================================
     HEADER
     ============================================================ */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg-card);
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .header .h-left { display: flex; align-items: center; gap: 12px; }
  .header .h-right { display: flex; align-items: center; gap: 18px; }
  .logo-img {
    height: 30px;
    max-width: 120px;
    width: auto;
    object-fit: contain;
    display: block;
  }
  .icon-btn {
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 4px;
  }
  .icon-btn svg { width: 24px; height: 24px; stroke: var(--text-primary); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .cart-badge {
    position: absolute;
    top: -2px;
    right: -4px;
    background: #FF3B30;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  /* ---- PDP blue brand header ---- */
  .header-blue {
    background: var(--brand-blue);
    height: auto;
    min-height: 56px;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .header-blue .icon-btn svg { stroke: #fff; }

  /* ============================================================
     HOMEPAGE
     ============================================================ */
  .search-wrap { padding: 10px 12px; }
  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 11px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .search-box svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
  .search-box input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 14px;
    font-family: inherit;
    background: transparent;
    color: var(--text-primary);
  }
  .search-box input::placeholder { color: var(--text-muted); }

  /* ---- Search suggestions dropdown ---- */
  .search-wrap { position: relative; }
  .search-dd {
    position: absolute;
    top: calc(100% - 4px);
    left: 12px;
    right: 12px;
    background: #fff;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,.15);
    max-height: 320px;
    overflow-y: auto;
    z-index: 80;
  }
  .search-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #F1F3F6;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:active { background: #F1F3F6; }
  .search-thumb {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--text-muted);
  }
  .search-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .search-name { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-arrow { color: var(--text-muted); font-size: 14px; flex-shrink: 0; }
  .search-empty { padding: 12px; font-size: 13px; color: var(--text-muted); text-align: center; }

  /* ---- Delivery location bar (below header, above search) ---- */
  .loc-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    background: #FFFFFF;
    font-size: 13px;
    cursor: pointer;
  }
  .loc-bar svg { width: 16px; height: 16px; fill: #212121; stroke: none; flex-shrink: 0; }
  .loc-not-set { color: #212121; font-weight: 500; }
  .loc-select { color: #2874F0; font-weight: 600; padding-left: 2px; cursor: pointer; }
  /* Truncate a saved address to one line so it never breaks the bar layout */
  .loc-addr-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 250px;
    display: inline-block;
    vertical-align: middle;
  }

  /* ---- Category navigation (horizontal scroll, hidden scrollbar) ---- */
  .cat-nav {
    display: flex;
    gap: 24px;
    overflow-x: auto;
    white-space: nowrap;
    padding: 10px;
    background: var(--bg-card);
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .cat-nav::-webkit-scrollbar { display: none; }
  .cat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 500;
    color: #212121;
    text-align: center;
    padding-bottom: 5px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .cat-item.active {
    color: var(--brand-blue);
    font-weight: 600;
    border-bottom-color: var(--brand-blue);
  }
  .cat-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #F1F3F6;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cat-icon svg {
    width: 26px;
    height: 26px;
    stroke: #424242;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hero {
    height: 200px;
    margin: 10px;
    border-radius: 8px;
    background: var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 15px;
  }

  /* ---- Sale banner: full-bleed poster image with overlaid timer ---- */
  .sale-banner {
    position: relative;
    margin: 0 0 12px; /* gap before the product grid */
    padding: 0;
    width: 100%;
    background: #082E6B;
    overflow: hidden;
    color: #fff;
  }
  .sale-poster { width: 100%; height: auto; display: block; }
  /* Timer overlay: pinned bottom-right, scaled to ~1/4 visual area,
     frosted glass so it reads over any poster artwork */
  .sale-overlay {
    position: absolute;
    bottom: 10px;
    right: 10px;
    transform: scale(0.65);
    transform-origin: bottom right;
    text-align: center;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  .sale-sub {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 700;
    color: #212121; /* dark on the translucent white glass */
    margin-bottom: 8px;
  }
  .sale-boxes { display: flex; justify-content: center; gap: 12px; }
  .sale-box-wrap { display: flex; flex-direction: column; align-items: center; }
  .sale-box {
    background: #FFFFFF;
    color: #212121;
    border-radius: 6px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    min-width: 45px;
    padding: 6px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .sale-box-label {
    color: #212121; /* dark on the translucent white glass */
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-top: 4px;
  }

  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: var(--bg-app);
    padding: 4px 0;
  }

  .product-card {
    background: var(--bg-card);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }
  .product-card .img-ph {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eaeaea;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b0b0b0;
    font-size: 12px;
    border-radius: 4px;
  }
  .product-card .p-title {
    color: var(--text-primary);
    /* 2-line clamp: long real product names truncate with an ellipsis
       instead of breaking the grid layout */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 12px;
    line-height: 1.4;
  }
  .p-discount-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .p-discount { color: var(--text-success); font-weight: 600; }
  .p-strike { color: var(--text-muted); text-decoration: line-through; }
  .p-price-row { display: flex; align-items: center; gap: 6px; }
  .p-price { font-weight: 700; font-size: 15px; }
  /* ---- Logo slot next to price (drop logo file in as assured-logo.png) ---- */
  .badge-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 74px;
    height: 17px;
    background: transparent;
    border-radius: 2px;
    overflow: hidden;
    transform: translateY(-1px);
    flex-shrink: 0;
  }
  .badge-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .p-subtext { font-size: 11px; color: var(--text-primary); }

  /* ============================================================
     PRODUCT DETAILS PAGE
     ============================================================ */
  .pdp-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eaeaea;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b0b0b0;
    font-size: 14px;
  }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0; background: var(--bg-card); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #cfcfcf; }
  .dot.active { background: var(--brand-blue); width: 14px; border-radius: 3px; }

  .card-block {
    background: var(--bg-card);
    padding: 14px 16px;
    margin-top: 8px;
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
  }
  .pdp-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
  .pdp-highlights { list-style: disc; padding-left: 18px; }
  .pdp-highlights li { font-size: 13px; padding: 3px 0; color: var(--text-primary); }

  /* ---- PDP "Plus F-ASSURED" trust stamp ---- */
  .fa-stamp { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 10px; }
  .fa-stamp > svg { width: 22px; height: 22px; fill: var(--action-yellow); stroke: none; flex-shrink: 0; }
  .fa-stamp-text { display: flex; flex-direction: column; line-height: 1; }
  .fa-plus { color: var(--brand-blue); font-weight: 700; font-style: italic; font-size: 14px; }
  .fa-sub { color: #878787; font-style: italic; font-weight: 600; font-size: 8px; letter-spacing: .6px; margin-top: 2px; }
  .rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .rating-pill {
    background: var(--text-success);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .rating-count { color: var(--text-muted); font-size: 13px; }
  .pdp-price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .pdp-price { font-size: 24px; font-weight: 700; }
  .offers-list { list-style: none; margin-top: 8px; }
  .offers-list li {
    font-size: 13px;
    padding: 4px 0;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .offers-list .tag { color: var(--text-success); font-weight: 700; flex-shrink: 0; }
  .section-label { font-size: 15px; font-weight: 600; margin-bottom: 8px; }

  /* ---- PDP offer countdown ---- */
  .offer-timer {
    background: var(--bg-card);
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
  }
  .offer-timer .time { color: var(--action-orange); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---- PDP full-width promo image (edge-to-edge) ---- */
  .promo-image {
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #E0E0E0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 15px;
    margin-top: 8px;
  }

  /* ---- Bottom sticky action bar (PDP) ---- */
  .sticky-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    z-index: 60;
    display: flex;
  }
  .btn-half {
    flex: 1 1 50%;
    height: 52px;
    font-size: 15px;
    font-weight: 700;
  }
  .btn-cart {
    background: var(--bg-card);
    color: var(--text-primary);
    border-top: 1px solid var(--border-subtle);
    border-right: 1px solid var(--border-subtle);
  }
  .btn-buy { background: var(--action-yellow); color: #000; }

  /* ============================================================
     CART PAGE
     ============================================================ */
  .empty-cart {
    background: var(--bg-card);
    min-height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 36px;
  }
  .empty-cart svg { width: 96px; height: 96px; stroke: #cfcfcf; fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 24px; }
  .empty-cart h2 { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
  .empty-cart p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
  .btn-blue {
    background: var(--brand-blue);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 13px 44px;
    border-radius: 4px;
  }

  .cart-block {
    background: var(--bg-card);
    margin-bottom: 8px;
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
  }
  .addr-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    gap: 12px;
  }
  .addr-row .addr-label { font-size: 13px; color: var(--text-primary); font-weight: 500; }
  .btn-outline-blue {
    background: var(--bg-card);
    border: 1px solid var(--brand-blue);
    color: var(--brand-blue);
    font-size: 12px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .cart-item { padding: 16px 16px 0; }
  .cart-item + .cart-item { border-top: 1px solid var(--border-subtle); }
  .cart-item-top { display: flex; gap: 14px; }
  .cart-thumb-col { width: 90px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .cart-img {
    width: 90px;
    height: 90px;
    background: #eaeaea;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b0b0b0;
    font-size: 11px;
  }
  .qty-btn {
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .qty-select {
    width: 100%;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    font-family: inherit;
    outline: none;
  }
  .cart-img { cursor: pointer; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .cart-actions { display: flex; border-top: 1px solid var(--border-subtle); margin-top: 16px; }
  .cart-actions button {
    flex: 1;
    background: var(--bg-card);
    padding: 14px 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .cart-actions button + button { border-left: 1px solid var(--border-subtle); }

  .price-block-inner { padding: 14px 16px; }
  .dotted-sep { border-top: 1px dashed var(--border-subtle); margin: 8px 0; }
  .save-banner {
    background: #EAF9EF;
    color: var(--text-success);
    font-size: 13px;
    font-weight: 600;
    padding: 12px 16px;
    border-top: 1px solid var(--border-subtle);
  }
  .trust {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
  }
  .trust svg { width: 30px; height: 30px; stroke: var(--text-muted); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .info-i {
    display: inline-flex;
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--text-muted);
    border-radius: 50%;
    font-size: 9px;
    font-style: normal;
    color: var(--text-muted);
    align-items: center;
    justify-content: center;
    font-weight: 700;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* ============================================================
     CHECKOUT FLOW
     ============================================================ */
  .stepper {
    position: sticky;
    top: 56px;
    z-index: 40;
    background: var(--bg-card);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 10px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .step { display: flex; align-items: center; gap: 6px; }
  .step-circle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    background: var(--bg-app);
    color: var(--text-muted);
    border: 1.5px solid var(--text-muted);
  }
  .step-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .step.active .step-circle { background: var(--brand-blue); border-color: var(--brand-blue); color: #fff; }
  .step.active .step-label { color: var(--brand-blue); }
  .step-line { width: 24px; height: 1.5px; background: var(--border-subtle); }

  /* ---- Address form ---- */
  .address-form { background: var(--bg-card); padding: 8px 16px 90px; }
  .form-field { border-bottom: 1px solid var(--border-subtle); padding: 12px 0 10px; }
  .form-field label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .form-field input, .form-field select {
    width: 100%;
    border: none;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    background: transparent;
    padding: 2px 0;
  }
  .form-row { display: flex; gap: 16px; }
  .form-row .form-field { flex: 1; }

  /* Uniform 576x902 canvas: the wrapper does the edge-to-edge breakout
     and locks the 576/902 aspect ratio on a WHITE background. The image
     renders top-anchored at its natural scaled height, so any missing
     height appears as white padding at the BOTTOM only — the top edge
     never moves. Full-height (902) images fill the canvas exactly. */
  .rr-hero {
    margin-left: -16px;
    margin-right: -16px;
    width: calc(100% + 32px);
    aspect-ratio: 576 / 902;
    background: #fff;
    overflow: hidden;
    text-align: center;
    color: var(--text-muted);

  .carousel-slide {

    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #E0E0E0;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 15px;

    padding: 0;
    /* Edge-to-edge with breathing room below before the sale poster */
    margin: 0 0 12px;
    width: 100%;
    border-radius: 0;
    /* No hardcoded height: the slider expands/contracts to match the
       natural aspect ratio of the uploaded banner images */
    height: auto;

  .hero.carousel .carousel-slide { height: auto; background: var(--border-subtle); }
  /* Once JS measures the banners and locks a shared height, taller

  .hero.carousel.h-locked .carousel-slide { height: 100%; }

    height: 34px;

    background: rgba(255,255,255,.75);
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    z-index: 5;
  }
  .car-btn.left { left: 8px; }
  .car-btn.right { right: 8px; }
  .car-btn svg { width: 18px; height: 18px; stroke: #212121; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .pdp-image.carousel .carousel-slide img { cursor: zoom-in; }

  /* ============================================================
     IMAGE ZOOM LIGHTBOX
     ============================================================ */
  .lightbox {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0,0,0,.9);
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  /* capped at the 480px shell width so nothing overflows on zoom */
  .lightbox img {
    max-width: min(94vw, 480px);
    max-height: 86vh;
    width: auto;
    height: auto;
    object-fit: contain;
    background: #fff;
    border-radius: 6px;
  }
  .lb-close {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3001;
    padding: 0;
  }
  .lb-close svg { width: 20px; height: 20px; stroke: #212121; fill: none; stroke-width: 2.2; stroke-linecap: round; }

  /* ============================================================
     POST-PURCHASE: ORDERS / TRACKING / RETRY / SUCCESS
     ============================================================ */
  .order-card {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    cursor: pointer;
  }
  .order-thumb {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--text-muted);
  }
  .order-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .order-info { flex: 1; min-width: 0; }
  /* Status + arrow pinned to the absolute right of the card */
  .order-right { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .order-status { font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
  .order-status.cancelled { color: #d32f2f; }
  .order-name { font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order-warn { margin-top: 4px; font-size: 11px; color: #d32f2f; font-weight: 600; }

  /* Order details: segmented white cards on the grey page body */
  .od-idbar { background: #fff; padding: 10px 12px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); }
  .od-card { background: #fff; border: 1px solid var(--border-subtle); border-radius: 8px; margin: 8px; overflow: hidden; }
  .od-pad { padding: 12px; }

  /* Payment-pending warning banner */
  .pay-warn { background: #FCE8E8; border: 1px solid #F5C6C6; border-radius: 8px; margin: 8px; padding: 16px 12px; }
  .pay-warn-head { display: flex; align-items: center; gap: 8px; color: #d32f2f; font-weight: 700; font-size: 14px; }
  .pay-warn-sub { font-size: 12px; color: #555; margin: 8px 0 12px; line-height: 1.5; }
  .btn-complete-pay { width: 100%; height: 44px; background: var(--brand-blue); color: #fff; font-size: 14px; font-weight: 700; border-radius: 4px; }
  .pay-warn-note { margin-top: 10px; font-size: 11px; color: #64B5F6; line-height: 1.5; text-align: center; }

  /* Open Box Delivery card */
  .ob-head { display: flex; align-items: center; justify-content: space-between; padding: 12px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border-subtle); }
  .ob-link { color: var(--brand-blue); font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .ob-row { display: flex; padding: 12px 8px; }
  .ob-item { width: 33.33%; text-align: center; padding: 0 6px; }
  .ob-ic { width: 36px; height: 36px; border-radius: 50%; background: #F1F3F6; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; }
  .ob-ic svg { width: 18px; height: 18px; stroke: #424242; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ob-item span { display: block; font-size: 10.5px; color: var(--text-primary); line-height: 1.4; }

  /* Cancel / Need help split actions */
  .od-actions { display: flex; }
  .od-actions button { flex: 1; background: #fff; padding: 14px 4px; font-size: 13px; font-weight: 600; color: #555; }
  .od-actions button + button { border-left: 1px solid var(--border-subtle); }

  /* Bottom fluff cards */
  .rate-stars { display: flex; gap: 10px; padding: 4px 12px 14px; }
  .rate-stars svg { width: 26px; height: 26px; stroke: #B0B0B0; fill: none; stroke-width: 1.6; stroke-linejoin: round; }
  .od-helpful { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; font-size: 13px; font-weight: 500; }
  .od-helpful svg { width: 16px; height: 16px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .paylater-banner {
    height: 90px;
    margin: 8px;
    border-radius: 8px;
    background: #E8F1FF;
    border: 1px solid #CFE1FB;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brand-blue);
    font-weight: 700;
    font-size: 14px;
  }

  /* Order-cancelled success modal */
  .cancel-modal {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: rgba(0,0,0,0.5);
    z-index: 3000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cancel-card {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 340px;
    padding: 22px 18px 18px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,.2);
  }
  .cancel-title { font-size: 16px; font-weight: 700; color: #212121; }
  .cancel-sub { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 10px 0 16px; }
  .cancel-ok { width: 100%; height: 44px; background: var(--brand-blue); color: #fff; font-size: 14px; font-weight: 700; border-radius: 6px; }

  /* Dynamic payment-verification status text (fades in) */
  .pay-status {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #d32f2f;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .pay-status.show { opacity: 1; margin-bottom: 8px; }
  .pay-status .spinner { width: 14px; height: 14px; border-width: 2px; }

  /* ============================================================
     WINNER ANNOUNCEMENT TOAST
     ============================================================ */
  .winner-popup {
    position: fixed;
    bottom: 70px; /* just above the bottom nav with a small gap */
    height: 36px; /* ~60% of the nav bar height */
    /* 16px insets WITHIN the centered 480px shell */
    left: max(16px, calc(50% - 224px));
    right: max(16px, calc(50% - 224px));
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.95);
    /* deeper shadow for a floating feel + subtle brand border */
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    border: 1px solid rgba(40, 116, 240, 0.2);
    display: flex;
    align-items: center;
    padding: 0 12px;
    z-index: 2000; /* floats above all scrolling content */
    overflow: hidden;
    /* default: parked off-screen right */
    transform: translateX(120%);
    transition: transform 0.5s ease-out;
  }
  .winner-popup.slide-in { transform: translateX(0); }
  .winner-popup.slide-out { transform: translateX(-120%); transition: transform 0.5s ease-in; }
  .winner-badge {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-right: 10px;
  }
  .winner-badge img { width: 24px; height: 24px; object-fit: contain; display: block; }
  .popup-text {
    flex: 1;
    font-size: 12px;
    color: #212121;
    font-weight: 500;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .highlight-congrats { color: #2874F0; font-weight: 700; }
  .highlight-amount { color: #388E3C; font-weight: 800; font-size: 13px; }

  /* ============================================================
     CONTENT PROTECTION (screenshot / recording deterrence)
     ============================================================ */
  /* Full-viewport frosted shield shown when visibility/focus is lost
     or a capture attempt is detected */
  .shield-overlay {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 9999; /* above every layer, incl. success overlay */
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(255, 255, 255, 0.55);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    text-align: center;
  }
  .shield-overlay.on { display: flex; }
  /* Hard blur of the app content itself (backdrop-filter fallback) */
  body.shielded #app {
    filter: blur(14px);
    pointer-events: none;
  }
  .shield-msg {
    max-width: 320px;
    background: #fff;
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
    font-size: 14px;
    font-weight: 700;
    color: #212121;
  }
  .shield-msg small { display: block; margin-top: 6px; font-size: 12px; font-weight: 500; color: var(--text-muted); }

  /* CSS spinners */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: inline-block;
    border-radius: 50%;
    border: 2.5px solid rgba(0,0,0,.12);
    animation: spin 1s linear infinite;
  }
  .spinner.red { border-top-color: #d32f2f; }
  .spinner.blue { border-top-color: var(--brand-blue); }

  /* Vertical order tracking stepper: absolute dotted connector sits
     BEHIND the dots; markers have a white bg to mask the line */
  .tl-wrap { position: relative; padding: 4px 12px 0; }
  .tl-line {
    position: absolute;
    left: 20px;
    top: 24px;
    bottom: 24px;
    border-left: 2px dotted #cfcfcf;
    z-index: 0;
  }
  .tl-row { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; }
  .tl-marker {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .tl-dot-solid { width: 10px; height: 10px; border-radius: 50%; background: #cfcfcf; }
  /* Cancelled step: solid red circle with a white X */
  .tl-x {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background-color: #ff3333;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 10px;
    line-height: 1;
  }
  .tl-row.cancelled .tl-title { color: #ff3333; }
  .tl-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .tl-row.active .tl-title { color: var(--brand-blue); }
  .tl-warn { font-size: 11px; color: #d32f2f; font-weight: 600; margin-top: 3px; }
  .tl-row.grey .tl-title { color: #9e9e9e; font-weight: 500; }
  .tl-see-all { border-top: 1px solid var(--border-subtle); margin-top: 8px; padding: 12px; color: var(--brand-blue); font-size: 13px; font-weight: 600; cursor: pointer; }

  /* Order success animation: multi-stage.
     Stage 1 (0-3s): green disc expands from dead center over white.
     Stage 2: continuous check circle + ripple + breathe + flying stars.
     Stage 3 (3s): green fades to pure white; text flips to dark. */
  @keyframes greenExpand { 0% { transform: scale(0); } 100% { transform: scale(20); } }
  @keyframes greenFadeOut { to { opacity: 0; } }
  @keyframes ripple {
    0%   { transform: translate(-50%, -50%) scale(.8); opacity: .6; }
    100% { transform: translate(-50%, -50%) scale(2);  opacity: 0; }
  }
  @keyframes breathe {
    0%   { transform: translate(-50%, -50%) scale(1); }
    50%  { transform: translate(-50%, -50%) scale(1.15); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes starFly {
    0%   { transform: translate(0, 0) scale(.4); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
  }
  @keyframes textToDark { to { color: #212121; } }
  @keyframes subToRed { to { color: #d32f2f; } }

  .success-overlay {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: #fff; /* Stage 1 starts on a white screen */
    z-index: 4000; /* above lightbox, QR modal and sticky bars */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* Lives INSIDE .success-graphic so it expands from the exact center
     of the green checkmark circle */
  .success-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 120px;
    height: 120px;
    margin: -60px 0 0 -60px;
    border-radius: 50%;
    background: #15a85e;
    transform-origin: center center;
    z-index: 0;
    /* expand 0-3s ease-out, then fade back to white at exactly 3s */
    animation: greenExpand 3s ease-out forwards, greenFadeOut .8s ease-out 3s forwards;
  }
  /* Large solid white circle base: perfectly centered behind the
     checkmark circle (inside .success-graphic). transform-origin and
     the animation duration/timing EXACTLY match the green disc, so
     both expand outward from the checkmark center at the same speed. */
  @keyframes baseExpand { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .success-base {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 250px;
    height: 250px;
    margin: -125px 0 0 -125px;
    border-radius: 50%;
    background: #fff;
    transform-origin: center center;
    z-index: 1;
    transform: scale(0);
    /* fast pop: expands out in 1s while the green keeps growing */
    animation: baseExpand 1s ease-out forwards;
  }
  .success-graphic {
    position: relative;
    z-index: 2;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Sync: the tick circle + ripple/breathe layers + stars scale in
       together with the white base (fast 1s ease-out pop) while the
       green disc continues expanding to full screen behind them */
    transform: scale(0);
    animation: baseExpand 1s ease-out forwards;
  }
  /* Ripple / breathe / stars sit ABOVE the white base (z-index 1) so
     the looping green animations stay visible on top of it */
  .success-graphic .breathe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(21, 168, 94, .28);
    transform: translate(-50%, -50%);
    z-index: 2;
    animation: breathe 2s ease-in-out infinite;
  }
  .success-graphic .ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(21, 168, 94, .22);
    transform: translate(-50%, -50%);
    z-index: 2;
    animation: ripple 1.8s ease-out infinite;
  }
  .success-graphic .star {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    fill: #15a85e;
    stroke: none;
    opacity: 0;
    z-index: 3;
    animation: starFly 2s ease-out infinite;
  }
  .success-graphic .star.s1 { --tx: -70px; --ty: -55px; animation-delay: 0s; }
  .success-graphic .star.s2 { --tx: 75px;  --ty: -35px; animation-delay: .5s; }
  .success-graphic .star.s3 { --tx: 15px;  --ty: 75px;  animation-delay: 1s; }
  .success-check {
    position: relative;
    z-index: 4; /* topmost: above base, ripple/breathe and stars */
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 18px rgba(0,0,0,.15); /* stays visible on white */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .success-check svg { width: 40px; height: 40px; stroke: #15a85e; fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  /* Stage 3: text flips from white to dark exactly when green fades */
  @keyframes fadeInText { to { opacity: 1; } }
  .success-title {
    position: relative;
    z-index: 2;
    margin-top: 20px;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    /* fades in while the green covers the screen, flips dark at 3s */
    opacity: 0;
    animation: fadeInText .6s ease 1.2s forwards, textToDark .5s ease 3s forwards;
  }
  .success-sub {
    position: relative;
    z-index: 2;
    margin-top: 6px;
    color: #FFC0CB;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    animation: fadeInText .6s ease 1.4s forwards, subToRed .5s ease 3s forwards;
  }

  /* ============================================================
     REUSABLE TRUST BADGE (cart / summary / payment)
     ============================================================ */
  .trust-badge {
    background-color: #F1F3F6;
    padding: 16px;
    border-top: 1px solid #E0E0E0;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  .trust-badge svg { fill: #878787; width: 24px; height: 24px; flex-shrink: 0; }
  .trust-badge span { color: #878787; font-size: 12px; line-height: 1.4; font-weight: 500; }

  /* ---- Hero banner slide images: full width, proportional scaling,
     never cropped (no fixed height anywhere in the chain) ---- */
  .carousel-slide img { width: 100%; height: auto; display: block; }

  /* ---- Payment page UPI logos: fixed 36px box + contain-fit image
     so every logo appears the same size regardless of source dims ---- */
  .pay-logo {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #fff;
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .pay-logo img { width: 28px; height: 28px; object-fit: contain; display: block; }

  /* ============================================================
     GLOBAL PRODUCT THUMBNAILS (real photos in the old grey boxes)
     ============================================================ */
  /* Homepage grid cards */
  .product-card .img-ph { background: #fff; }
  .product-card .img-ph img { width: 100%; height: 100%; object-fit: contain; background: #fff; mix-blend-mode: multiply; display: block; }
  /* Cart list thumbnails (90px box, dims unchanged) */
  .cart-img { background: #fff; border: 1px solid var(--border-subtle); }
  .cart-img img { width: 100%; height: 100%; object-fit: contain; background: #ffffff; border-radius: 4px; flex-shrink: 0; display: block; }
  /* Order Summary thumbnails (72px box, dims unchanged) */
  .summary-thumb { background: #fff; border: 1px solid var(--border-subtle); }
  .summary-thumb img { width: 100%; height: 100%; object-fit: contain; background: #ffffff; border-radius: 4px; flex-shrink: 0; display: block; }
  /* Similar Products + Customers-also-bought mini cards */
  .sim-img { background: #fff; }
  .sim-img img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #ffffff; mix-blend-mode: multiply; border-radius: 4px 4px 0 0; display: block; }

  /* ---- UNIFORM SQUARE PRODUCT IMAGES ----
     Most photos are 784x784 but some are irregular (616x784,
     784x762...). Force every product image element into an identical
     1:1 square: contain-fit centers the photo and the missing width/
     height is filled with symmetric solid white. */
  .product-card .img-ph img,
  .pdp-image.carousel .carousel-slide img,
  .cart-img img,
  .summary-thumb img,
  .sim-img img {
    aspect-ratio: 1 / 1;
    width: 100%;
    object-fit: contain;
    background-color: #FFFFFF;
    display: block;
  }

  /* ============================================================
     ADD-TO-CART BOTTOM SHEET
     ============================================================ */
  .sheet-overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0,0,0,.5);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease-out;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .cart-sheet {
    position: fixed;
    bottom: -100%;
    left: 50%;
    transform: translateX(-50%); /* centers the sheet within the 480px shell */
    width: 100%;
    max-width: 480px;
    background: white;
    z-index: 1000; /* above sticky action bars (60) and bottom nav (100) */
    transition: bottom 0.3s ease-out;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
    padding: 16px;
  }
  .cart-sheet.open { bottom: 0; }
  .sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .sheet-head svg.check { width: 22px; height: 22px; stroke: #388E3C; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .sheet-title { font-size: 15px; font-weight: 700; color: #388E3C; flex: 1; }
  .sheet-close { background: none; padding: 4px; }
  .sheet-close svg { width: 20px; height: 20px; stroke: var(--text-primary); fill: none; stroke-width: 2; stroke-linecap: round; }
  .sheet-sub { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .sheet-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; -ms-overflow-style: none; }
  .sheet-scroll::-webkit-scrollbar { display: none; }
  .btn-view-cart {
    width: 100%;
    height: 46px;

/* ============================================================
   ONE-TIME PRICING OVERHAUL
   New selling price per category (parsed from the name). The
   original crossed-out price is untouched; the discount string is
   recalculated mathematically from the new selling price.
   ============================================================ */
(function repriceCatalogue() {
  /* deterministic value inside [min, max], seeded by id, so prices
     stay stable across renders and reloads */
  const priceIn = (id, min, max) => min + ((id * 37) % (max - min + 1));
  PRODUCTS.forEach(p => {
    const n = p.name.toLowerCase();
    const isApple = n.startsWith('apple');
    let newPrice;
    if (isApple && (n.includes('watch') || n.includes('airpods'))) {
      newPrice = priceIn(p.id, 300, 399);          /* Apple Watch & AirPods */
    } else if (n.includes('adapter') || n.includes('charger')) {
      newPrice = 149;                               /* chargers: flat */
    } else if (/\bring\b/.test(n)) {
      newPrice = priceIn(p.id, 119, 149);           /* smart rings (word-boundary: "Pairing" is NOT a ring) */
    } else if (n.includes('soundbar')) {
      newPrice = priceIn(p.id, 129, 199);           /* soundbars */
    } else if (n.includes('watch')) {
      newPrice = priceIn(p.id, 149, 249);           /* smartwatches */
    } else if (n.includes('headphone') || n.includes('headset') || n.includes('headbug')) {
      newPrice = priceIn(p.id, 129, 199);           /* headphones */
    } else {
      newPrice = priceIn(p.id, 119, 149);           /* earpods / earbuds / other audio */
    }
    /* Retail-style pricing: every price ends in 9 (119, 139, 249...) */
    newPrice = newPrice - (newPrice % 10) + 9;
    p.priceNum = newPrice;
    p.discount = Math.round(((p.originalPriceNum - newPrice) / p.originalPriceNum) * 100) + '% Off';
  });
})();

/* Fisher-Yates shuffle (in place; returns the array) */
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = array[i];
    array[i] = array[j];
    array[j] = t;
  }
  return array;
}

const saleEnd = Date.now() + SALE_DURATION_MS;

function saleRemainingSec() {
  return Math.max(0, Math.floor((saleEnd - Date.now()) / 1000));
}

/* Single interval drives every timer element currently in the DOM,
   keeping homepage boxes and PDP timer perfectly in sync. */
function tickTimers() {
  const total = saleRemainingSec();
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;

  const eh = document.getElementById('sale-h');
  if (eh) {
    eh.textContent = pad2(h);
    document.getElementById('sale-m').textContent = pad2(m);
    document.getElementById('sale-s').textContent = pad2(s);
  }
  const ep = document.getElementById('pdp-timer');
  if (ep) {
    ep.textContent = pad2(h * 60 + m) + ':' + pad2(s);
  }
  /* Homepage price-pill timers: every pill ticks from the same
     global 30-minute countdown, perfectly in sync */
  const pills = document.querySelectorAll('.timer-sync');
  if (pills.length) {
    const label = pad2(h * 60 + m) + ':' + pad2(s);
    pills.forEach(el => { el.textContent = label; });
  }
}

/* ============================================================
   CAROUSEL ENGINE
   One interval per active slider, keyed by container id. The
   router destroys every slider on navigation and each page
   re-initializes its own after render, so timers never leak
   or stack when routing back and forth (SPA-safe).
   ============================================================ */
const sliders = {}; /* id -> { index, count, intervalMs, timer } */

function initSlider(id, count, intervalMs) {
  destroySlider(id); /* re-init safe: never stack intervals */
  /* Seamless one-direction loop: append a CLONE of the first slide
     (1-2-3-4-[1']); after sliding onto the clone we snap back to the
     real first slide with the transition disabled, so the loop never
     scrolls backwards. Guard ensures the clone is added only once. */
  const track = document.getElementById(id + '-track');
  if (track && track.children.length === count) {
    track.appendChild(track.children[0].cloneNode(true));
  }
  const s = { index: 0, count: count, intervalMs: intervalMs, timer: null };
  sliders[id] = s;
  s.timer = setInterval(function () { slideStep(id, 1); }, intervalMs);
  updateSlider(id);
}

function destroySlider(id) {
  const s = sliders[id];
  if (s && s.timer) clearInterval(s.timer);
  delete sliders[id];
}

function destroyAllSliders() {
  Object.keys(sliders).forEach(function (id) { destroySlider(id); });
}

/* Paint the current slide: shift the track and sync pagination dots */
function updateSlider(id) {
  const s = sliders[id];
  const track = document.getElementById(id + '-track');
  if (!s || !track) return;
  track.style.transform = 'translateX(-' + (s.index * 100) + '%)';
  updateDots(id);
}

function updateDots(id) {
  const s = sliders[id];
  if (!s) return;
  const active = s.index % s.count; /* the clone maps back to dot 1 */
  document.querySelectorAll('#' + id + '-dots .dot').forEach(function (d, i) {
    d.classList.toggle('active', i === active);
  });
}

/* Instantly reposition the track with the transition disabled */
function snapTo(id, index) {
  const s = sliders[id];
  const track = document.getElementById(id + '-track');
  if (!s || !track) return;
  track.style.transition = 'none';
  s.index = index;
  track.style.transform = 'translateX(-' + (index * 100) + '%)';
  void track.offsetWidth; /* force reflow so the next shift animates */
  track.style.transition = '';
}

/* One-direction infinite loop: 1-2-3-4-[1'] then an invisible snap
   back to the real slide 1 — the track never scrolls backwards. */
function slideStep(id, dir) {
  const s = sliders[id];
  if (!s) return;

  /* Parked on the clone? Silently become the real first slide. */
  if (s.index >= s.count) snapTo(id, 0);

  if (dir === 1) {
    s.index++;
  } else if (s.index === 0) {
    snapTo(id, s.count); /* backward wrap: jump to the clone, then animate */
    s.index = s.count - 1;
  } else {
    s.index--;
  }
  updateSlider(id);

  /* Landed on the clone: once the .4s transition finishes, snap back
     to the real first slide with zero visible movement */
  if (s.index === s.count) {
    setTimeout(function () {
      const st = sliders[id];
      if (st && st.index === st.count) { snapTo(id, 0); updateDots(id); }
    }, 410);
  }
}

/* Manual prev/next: clear the running interval and restart it AFTER
   stepping, so an auto-slide never fires right after a user click */
function slideManual(id, dir) {
  const s = sliders[id];
  if (!s) return;
  clearInterval(s.timer);
  slideStep(id, dir);
  s.timer = setInterval(function () { slideStep(id, 1); }, s.intervalMs);
}

/* Equalize hero slide heights: wait for every banner to load, find the
   SHORTEST natural aspect ratio (height/width), lock the slider to that
   height, and let object-fit: cover center-crop the taller ones so any
   excess is cut equally from top and bottom. No grey bands remain. */
function equalizeHeroHeight() {
  const car = document.getElementById('hero-car');
  if (!car) return;
  const imgs = car.querySelectorAll('.carousel-slide img');
  if (!imgs.length) return;
  let pending = imgs.length;
  let minRatio = Infinity;
  imgs.forEach(function (img) {
    const measure = function () {
      if (img.naturalWidth > 0) {
        minRatio = Math.min(minRatio, img.naturalHeight / img.naturalWidth);
      }
      if (--pending === 0 && isFinite(minRatio) && minRatio > 0) {
        car.style.height = Math.round(car.clientWidth * minRatio) + 'px';
        car.classList.add('h-locked');
      }
    };
    if (img.complete) { measure(); }
    else { img.onload = measure; img.onerror = measure; }
  });
}

/* Keep the locked height correct if the viewport width changes */
window.addEventListener('resize', equalizeHeroHeight);

/* Dynamic totals for any list of items (cart or direct buy) —
   quantity-aware: every line is multiplied by its qty (default 1) */
function totalsFor(items) {
  const qtyOf = it => it.qty || 1;
  const totalOriginal = items.reduce((s, it) => s + it.originalPriceNum * qtyOf(it), 0);
  const totalFinal = items.reduce((s, it) => s + it.priceNum * qtyOf(it), 0);
  return {
    count: items.reduce((s, it) => s + qtyOf(it), 0),
    totalOriginal: totalOriginal,
    totalFinal: totalFinal,
    totalDiscount: totalOriginal - totalFinal
  };
}

  document.body.appendChild(overlay);

  /* double rAF: paint the off-screen state first so the bottom

      overlay.classList.add('open');

  const overlay = document.getElementById('sheet-overlay');

    if (overlay) overlay.classList.remove('open');
    setTimeout(function () {
      sheet.remove();
      if (overlay) overlay.remove();
    }, 300);
  } else if (overlay) {
    overlay.remove();
  }
}

/* ============================================================
   ROUTER (hash-based client-side routing)
   ============================================================ */
function navigate(path) {
  if (window.location.hash === '#' + path) { router(); }
  else { window.location.hash = path; }
}

function router() {
  destroyAllSliders(); /* stop carousel timers from the previous view */
  /* Cancel any in-flight payment processing if the user navigates away */
  if (typeof processingTimer !== 'undefined' && processingTimer) {
    clearTimeout(processingTimer);
    processingTimer = null;
  }
  if (typeof clearStatusTimers === 'function') clearStatusTimers();
  const hash = window.location.hash.replace(/^#/, '') || '/';
  const productMatch = hash.match(/^\/product\/(\d+)$/);
  const orderDetailsMatch = hash.match(/^\/order-details\/(\d+)$/);
  const retryMatch = hash.match(/^\/checkout\/retry\/(\d+)$/);

  if (productMatch) {
    state.selectedProductId = parseInt(productMatch[1], 10);
    renderProductPage(state.selectedProductId);
  } else if (orderDetailsMatch) {
    renderOrderDetailsPage(parseInt(orderDetailsMatch[1], 10));
  } else if (retryMatch) {
    renderRetryPage(parseInt(retryMatch[1], 10));
  } else if (hash === '/orders') {
    renderOrdersPage();
  } else if (hash === '/order-success') {
    renderOrderSuccessPage();
  } else if (hash === '/all-products') {
    renderAllProductsPage();
  } else if (hash === '/account') {
    renderAccountPage();
  } else if (hash === '/categories') {
    renderCategoriesPage();
  } else if (hash === '/login') {
    renderLoginPhonePage();
  } else if (hash === '/login/name') {
    renderLoginNamePage();
  } else if (hash === '/cart') {
    renderCartPage();
  } else if (hash === '/checkout/address') {
    renderAddressPage();
  } else if (hash === '/checkout/summary') {
    renderSummaryPage();
  } else if (hash === '/checkout/payment') {
    renderPaymentPage();
  } else {
    renderHomePage();
  }
  /* ---- Premium page-enter animation on every navigation ---- */
  const appContainer = app();
  appContainer.classList.remove('animate-page-enter');
  void appContainer.offsetWidth; /* force reflow so the animation restarts */
  appContainer.classList.add('animate-page-enter');
  /* Remove the class when done: a lingering transform would make #app the
     containing block for position:fixed children (bottom nav, checkout bars,
     drawer) and detach them from the viewport. */
  appContainer.addEventListener('animationend', function clearAnim() {
    appContainer.classList.remove('animate-page-enter');
    appContainer.removeEventListener('animationend', clearAnim);
  });

  window.scrollTo(0, 0);
  tickTimers(); /* paint timers immediately after render, no 1s blank */
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);

const app = () => document.getElementById('app');

function checkoutStepper(activeStep) {
  const steps = ['Address', 'Order Summary', 'Payment'];
  return '<div class="stepper">' + steps.map((label, i) => {
    const n = i + 1;
    const cls = n === activeStep ? 'step active' : 'step';
    const line = n < steps.length ? '<div class="step-line"></div>' : '';
    return '<div class="' + cls + '"><div class="step-circle">' + n +
           '</div><div class="step-label">' + label + '</div></div>' + line;
  }).join('') + '</div>';
}

   instead of history.back() — e.g. My Orders always goes home so the
   user can never step back into the order-success animation */

  if (!q) { dd.style.display = 'none'; dd.innerHTML = ''; return; }
  const matches = PRODUCTS.filter(p => p.name.toLowerCase().startsWith(q)).slice(0, 8);
  dd.innerHTML = matches.length
    ? matches.map(p =>
        '<div class="search-item" onclick="navigate(\'/product/' + p.id + '\')">' +
          '<span class="search-thumb">' + thumbImg(p) + '</span>' +
          '<span class="search-name">' + p.name + '</span>' +
          '<span class="search-arrow">\u2197</span>' +

      ).join('')
    : '<div class="search-empty">No products found</div>';
  dd.style.display = 'block';
}

  const slideImg = n =>
    '<div class="carousel-slide"><img src="' + imgFolder + 'p' + p.id + '-' + n + '.png" alt="Product image ' + n + '" onclick="openLightbox(this.src)" ' +

/* ============================================================
   CART PAGE
   ============================================================ */
function renderCartPage() {
  /* ---- State A: Empty cart ---- */
  if (cart.length === 0) {
    app().innerHTML =
      subHeader('My Cart') +
      '<div class="empty-cart">' +
        ICONS.cart.replace('<svg ', '<svg width="96" height="96" ') +
        '<h2>Your cart is empty!</h2>' +
        '<p>Your cart is currently empty. Explore our products and start adding items now!</p>' +
        '<button class="btn-blue" onclick="navigate(\'/\')">Shop Now</button>' +
      '</div>' +
      bottomNav('cart');
    return;
  }

  /* ---- State B: Populated cart ---- */
  const t = cartTotals();

  const itemsHtml = cart.map((item, idx) =>
    '<div class="cart-item">' +
      '<div class="cart-item-top">' +
        '<div class="cart-thumb-col">' +
          '<div class="cart-img" onclick="navigate(\'/product/' + item.id + '\')">' + thumbImg(item) + '</div>' +
          '<select class="qty-select" aria-label="Quantity" onchange="setQty(' + idx + ', this.value)">' +
            [1, 2, 3, 5].map(q => '<option value="' + q + '"' + ((item.qty || 1) === q ? ' selected' : '') + '>Qty: ' + q + '</option>').join('') +
          '</select>' +
        '</div>' +
        '<div class="cart-item-info">' +
          '<div class="cart-item-title">' + item.name + '</div>' +
          '<div class="rating-row" style="margin-bottom:8px">' +
            '<span class="rating-pill" style="font-size:11px">' + (item.rating || '4.3') + ' ' + ICONS.star + '</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
            '<span class="p-strike" style="font-size:13px">' + fmt(item.originalPriceNum * (item.qty || 1)) + '</span>' +
            '<span class="p-discount" style="font-size:13px">' + item.discount + '</span>' +
            '<span class="p-price" style="font-size:16px">' + fmt(item.priceNum * (item.qty || 1)) + '</span>' +
          '</div>' +
          '<div class="p-subtext" style="margin-top:6px;color:var(--text-success);font-weight:600">Free Delivery in Two Days</div>' +
        '</div>' +
      '</div>' +
      '<div class="cart-actions">' +
        '<button onclick="saveForLater(' + idx + ')">Save for later</button>' +
        '<button onclick="removeFromCart(' + idx + ')">Remove</button>' +
        '<button onclick="startCheckout()">Buy this now</button>' +
      '</div>' +
    '</div>'
  ).join('');

  /* Address block: mirrors the Order Summary "Delivered to:" card once an
     address is saved; otherwise keeps the pincode CTA. */
  let addrBlockHtml;
  if (savedAddress) {
    const ad = savedAddress;
    const addrText = (ad.name || 'User') + ', ' + (ad.phone || '') + '<br/>' +
      [ad.house, ad.road, ad.city, ad.state].filter(Boolean).join(', ') +
      (ad.pincode ? ' \u2013 ' + ad.pincode : '');
    addrBlockHtml =
      '<div class="card-block" style="margin-top:8px">' +
        '<div class="deliver-to"><strong>Delivered to:</strong><br/>' + addrText + '</div>' +
      '</div>';
  } else {
    addrBlockHtml =
      '<div class="cart-block" style="margin-top:8px">' +
        '<div class="addr-row">' +
          '<span class="addr-label">From Saved Addresses</span>' +
          '<button class="btn-outline-blue" onclick="startAddress(\'checkout\')">Enter Delivery Pincode</button>' +
        '</div>' +
      '</div>';
  }

  app().innerHTML =
    subHeader('My Cart') +

    addrBlockHtml +

    '<div class="cart-block">' + itemsHtml + '</div>' +

    '<div class="cart-block">' +
      '<div class="price-block-inner">' +
        '<div class="section-label">Price Details</div>' +
        '<div class="price-row"><span>Price (' + (t.count === 1 ? '1 item' : t.count + ' items') + ')</span><span>' + fmt(t.totalOriginal) + '</span></div>' +
        '<div class="price-row"><span>Discount</span><span class="green">\u2212 ' + fmt(t.totalDiscount) + '</span></div>' +
        '<div class="dotted-sep"></div>' +
        '<div class="price-row" style="font-weight:700;font-size:15px"><span>Total Amount</span><span>' + fmt(t.totalFinal) + '</span></div>' +
      '</div>' +
      '<div class="save-banner">You\u2019ll save ' + fmt(t.totalDiscount) + ' on this order!</div>' +
    '</div>' +

    trustBadgeHtml() +

    '<div class="page-pad-bottom"></div>' +

    '<div class="checkout-bar">' +
      '<div class="amount">' + fmt(t.totalFinal) + '<i class="info-i">i</i><small>Total Amount</small></div>' +
      '<button class="btn-yellow" onclick="startCheckout()">Place Order</button>' +
    '</div>';
}

/* ============================================================
   LOGIN FLOW (two steps: phone, then name)
   ============================================================ */
function loginHeader() {
  return '<header class="login-header">' +
    '<button class="icon-btn" onclick="navigate(\'/\')" aria-label="Close">' + ICONS.close + '</button>' +
    '<img class="logo-img" src="' + IMG_LOGO + '" alt="Logo" onerror="this.remove()" />' +
    '<span style="width:32px;flex-shrink:0"></span>' +
  '</header>';
}

function onPhoneInput(el) {
  /* strictly numeric, max 10 digits, must start with 6-9 */
  el.value = el.value.replace(/\D/g, '').slice(0, 10);
  const btn = document.getElementById('login-cta');
  const err = document.getElementById('login-err');
  const startsValid = el.value.length === 0 || /^[6-9]/.test(el.value);
  if (err) err.style.display = startsValid ? 'none' : 'block';
  const ok = el.value.length === 10 && /^[6-9]/.test(el.value);
  btn.classList.toggle('enabled', ok);
  btn.disabled = !ok;
}

/* ---- Email login mode ---- */
function toggleLoginMode() {
  loginMode = loginMode === 'phone' ? 'email' : 'phone';
  /* Full re-render swaps label, input type, prefix, and link text
     instantly, and clears any existing input value. */
  renderLoginPhonePage();
}

function validEmail(v) {
  return v.includes('@') && v.includes('.');
}

function onEmailInput(el) {
  const btn = document.getElementById('login-cta');
  const err = document.getElementById('login-email-error');
  const v = el.value.trim();
  const ok = validEmail(v);
  if (err) err.style.display = (v.length > 0 && !ok) ? 'block' : 'none';
  btn.classList.toggle('enabled', ok);
  btn.disabled = !ok;
}

/* Unified Continue handler for both login modes */
function submitLogin() {
  if (loginMode === 'email') {
    const el = document.getElementById('login-email');
    const v = el ? el.value.trim() : '';
    if (!validEmail(v)) {
      const err = document.getElementById('login-email-error');
      if (err) err.style.display = 'block';
      return;
    }
    pendingEmail = v;
    pendingPhone = '';
    navigate('/login/name');
    return;
  }
  const el = document.getElementById('login-phone');
  if (!el || el.value.length !== 10 || !/^[6-9]/.test(el.value)) return;
  pendingPhone = el.value;
  pendingEmail = '';
  navigate('/login/name');
}

function onNameInput(el) {
  /* requires first and last name (at least one space between words) */
  const btn = document.getElementById('login-cta');
  const err = document.getElementById('login-err');
  const v = el.value.trim();
  const ok = v.length > 0 && v.indexOf(' ') > 0;
  if (err) err.style.display = (el.value.length > 0 && !ok) ? 'block' : 'none';
  btn.classList.toggle('enabled', ok);
  btn.disabled = !ok;
}

function finishLogin() {
  const el = document.getElementById('login-name');
  if (!el) return;
  const v = el.value.trim();
  if (v.length === 0 || v.indexOf(' ') < 1) {
    const err = document.getElementById('login-err');
    if (err) err.style.display = 'block';
    return;
  }
  userProfile = { name: v, phone: pendingPhone, email: pendingEmail };
  isLoggedIn = true;
  pendingPhone = '';
  pendingEmail = '';
  const dest = postLoginRedirect || '/account';
  postLoginRedirect = '';
  navigate(dest);
}

function logOut() {
  isLoggedIn = false;
  userProfile = { name: '', phone: '', email: '' };
  renderAccountPage();
}

/* Checkout authentication guard with smart address skip */
function startCheckout() {
  addressEntrySource = 'checkout';
  state.retryOrderId = null; /* fresh checkout, not a payment retry */
  if (!isLoggedIn) {
    postLoginRedirect = '/checkout/address';
    navigate('/login');
  } else if (savedAddress === null) {
    navigate('/checkout/address');
  } else {
    navigate('/checkout/summary');
  }
}

/* Delivery-location entry points (homepage bar, cart pincode button).
   source: 'homepage' (default) sends the user back home after saving;
   anything else continues into the checkout flow. */
function startAddress(source) {
  addressEntrySource = source || 'homepage';
  if (!isLoggedIn) {
    postLoginRedirect = '/checkout/address';
    navigate('/login');
  } else {
    navigate('/checkout/address');
  }
}

function renderLoginPhonePage() {
  const isEmail = loginMode === 'email';

  /* Mode-aware field: input type, label, placeholder and prefix all
     swap with loginMode. Re-rendering also clears any previous value
     so the CTA always resets to its disabled/grey state. */
  const fieldHtml = isEmail
    ? '<div class="float-field">' +
        '<label>Email-ID</label>' +
        '<input id="login-email" type="email" inputmode="email" placeholder="Enter your Email-ID" oninput="onEmailInput(this)" autocomplete="email" />' +
      '</div>' +
      '<div class="login-err" id="login-email-error" style="display:none;text-align:left;margin-top:8px;margin-bottom:0">Please enter a valid Email-ID</div>'
    : '<div class="float-field">' +
        '<label>Phone Number</label>' +
        '<span class="prefix">+91</span>' +
        '<input id="login-phone" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter your phone number" oninput="onPhoneInput(this)" autocomplete="tel" />' +
      '</div>';

  app().innerHTML =
    loginHeader() +
    '<div class="login-body">' +
      '<div class="login-title">Log in for the best experience</div>' +
      '<div class="login-sub">' + (isEmail ? 'Enter your Email-ID to continue' : 'Enter your phone number to continue') + '</div>' +
      fieldHtml +
      /* Inline onclick survives dynamic innerHTML injection (SPA routing) */
      '<div class="login-alt" onclick="toggleLoginMode()">' + (isEmail ? 'Use Phone Number' : 'Use Email-ID') + '</div>' +
      '<div class="login-terms">By continuing, you confirm that you are above 18 years of age, and you agree to the Flipkart\u2019s <span class="blue">Terms of Use</span> and <span class="blue">Privacy Policy</span></div>' +
    '</div>' +
    '<div class="login-cta-bar">' +
      '<div class="login-err" id="login-err" style="display:none">Please enter a valid phone number</div>' +
      '<button class="btn-cta" id="login-cta" disabled onclick="submitLogin()">Continue</button>' +
    '</div>';
}

function renderLoginNamePage() {
  if (!pendingPhone && !pendingEmail) { navigate('/login'); return; }
  app().innerHTML =
    loginHeader() +
    '<div class="login-body">' +
      '<div class="login-title">Just one more step</div>' +
      '<div class="login-sub">Enter your full name to set up your account</div>' +
      '<div class="float-field">' +
        '<label>Full Name</label>' +
        '<input id="login-name" type="text" oninput="onNameInput(this)" autocomplete="name" />' +
      '</div>' +
    '</div>' +
    '<div class="login-cta-bar">' +
      '<div class="login-err" id="login-err" style="display:none">Enter you valid Real name</div>' +
      '<button class="btn-cta" id="login-cta" disabled onclick="finishLogin()">Finish</button>' +
    '</div>';
}

/* ============================================================
   CHECKOUT STEP 1: ADDRESS
   ============================================================ */
const INDIAN_STATES = [
  'Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat',
  'Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh',

  'Uttarakhand','West Bengal','Andaman and Nicobar Islands','Chandigarh',
  'Dadra and Nagar Haveli and Daman and Diu','Delhi','Jammu and Kashmir',

/* ---- Address form validation ---- */
/* min 3 chars AND no character repeated 3+ times consecutively (anti-spam) */
function validText(v) {
  return v.length >= 3 && !/(.)\1{2,}/.test(v);
}

function addrRules() {
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  return {
    pin: /^\d{6}$/.test(v('f-pin')),
    city: validText(v('f-city')),
    state: v('f-state') !== '',
    house: validText(v('f-house')),
    road: validText(v('f-road'))
  };
}

function showAddrError(key, show) {
  const el = document.getElementById('err-' + key);
  if (el) el.style.display = show ? 'block' : 'none';
}

/* Re-evaluates every rule; toggles the orange button state.
   When showErrors is true, reveals every failing field's message. */
function validateAddress(showErrors) {
  const r = addrRules();
  const all = r.pin && r.city && r.state && r.house && r.road;
  const btn = document.getElementById('save-addr-btn');
  if (btn) btn.classList.toggle('enabled', all);
  const mainErr = document.getElementById('address-main-error');
  if (mainErr && all) mainErr.style.display = 'none';
  if (showErrors) {
    showAddrError('pin', !r.pin);
    showAddrError('city', !r.city);
    showAddrError('state', !r.state);
    showAddrError('house', !r.house);
    showAddrError('road', !r.road);
  }
  return all;
}

/* oninput: clear the field's error once fixed, keep button in sync */
function onAddrInput(key) {
  const r = addrRules();
  if (r[key]) showAddrError(key, false);
  validateAddress(false);
}

/* onblur / onchange: surface the field's error if still invalid */
function onAddrBlur(key) {
  const r = addrRules();
  showAddrError(key, !r[key]);
}

function saveAddress() {
  if (!validateAddress(true)) {
    const mainErr = document.getElementById('address-main-error');
    if (mainErr) mainErr.style.display = 'block';
    return;
  }
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  savedAddress = {
    name: val('f-name'),
    phone: val('f-mobile'),
    pincode: val('f-pin'),
    city: val('f-city'),
    state: val('f-state'),
    house: val('f-house'),
    road: val('f-road')
  };
  /* Context-aware routing: return home if the flow began on the
     homepage location bar, otherwise continue into checkout. */
  if (addressEntrySource === 'homepage') {
    navigate('/');
  } else {
    navigate('/checkout/summary');
  }
}
